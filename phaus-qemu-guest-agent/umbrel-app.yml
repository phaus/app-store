manifestVersion: 1
id: phaus-qemu-guest-agent
name: QEMU guest agent
tagline: QEMU guest agent
icon: https://raw.githubusercontent.com/phaus/app-store/master/phaus-qemu-guest-agent/icon.svg
category: Development
version: "11.1.1"
port: 16160
description: >
  This agent should be installed, if you want to run Umbrel as a Guest under QEMU.  
  It allows the QEMU host to exchange information with the guest.  
  Based on <a href="https://github.com/phaus/qemu-ga-container">phaus/qemu-ga-container</a>.  
  Details about the guest agent itself can be found <a href="https://wiki.qemu.org/Features/GuestAgent">here</a>  
  The app includes a stats service with a dashboard (port 16160): CPU, memory, disk, uptime and agent status of the host VM,  
  plus a Prometheus /metrics endpoint on the same port.  
  The icon is <a href="https://www.flaticon.com/de/kostenlose-icons/hypervisor">Hypervisor Icons created by Kalashnyk - Flaticon</a>.  
developer: Philipp Haußleiter
website: https://wiki.qemu.org/Features/GuestAgent
submitter: phaus
submission:
repo: https://github.com/phaus/qemu-ga-container
support: https://github.com/phaus/qemu-ga-container/issues
gallery:
  - https://raw.githubusercontent.com/phaus/app-store/master/phaus-qemu-guest-agent/screenshots/dashboard.png
releaseNotes: >
  - New: Prometheus /metrics endpoint (port 16160) with VM runtime metrics — agent status, OS info, CPU, load, uptime, memory, disk
  - Update to container image 11.1.1 (repo links + maintainer metadata, no agent changes)
  - Repo link now points to phaus/qemu-ga-container
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""