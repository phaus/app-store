version: "3.7"

services:
  agent:
    image: ghcr.io/phaus/qemu-ga-container:11.1.1@sha256:b4b2e8400e106de360589178ca0dcabab6fe0881f0948fbe1aed8e8be1a09982
    privileged: true
    network_mode: "host"
    environment:
      STATS_PORT: "16160"
    ports:
      - "16160:16160"
    volumes:
      - "/dev:/dev"
      - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
      - "/sys/fs/cgroup:/sys/fs/cgroup"
      - "/sbin/shutdown:/sbin/shutdown"
      - "/bin/systemctl:/bin/systemctl"
    restart: on-failure
    stop_grace_period: 1m
    command: ["-m", "virtio-serial", "-p", "/dev/virtio-ports/org.qemu.guest_agent.0"]
