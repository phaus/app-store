version: "3.7"

services:
  agent:
    image: ghcr.io/phaus/qemu-ga-container:11.0.4@sha256:7fe465e578ac189e2ce4c43350164a44ce308b0c4f10f4e13859065dfc7659f3
    privileged: true
    network_mode: "host"
    environment:
      STATS_PORT: "16160"
    ports:
      - "16160:16160"
    volumes:
      - "/dev:/dev"
      - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
      - "/sys/fs/cgroup:/sys/fs/cgroup"
      - "/sbin/shutdown:/sbin/shutdown"
      - "/bin/systemctl:/bin/systemctl"
    restart: on-failure
    stop_grace_period: 1m
    command: ["-m", "virtio-serial", "-p", "/dev/virtio-ports/org.qemu.guest_agent.0"]
