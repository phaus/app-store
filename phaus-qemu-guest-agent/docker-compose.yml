version: "3.7"

services:
  agent:
    image: ghcr.io/phaus/qemu-ga-container:11.0.3@sha256:b8f2d4858dcf6134bc53611f1fb9c0bb0dcaf519e395376a5effd6dfff5b8c44
    privileged: true
    network_mode: "host"
    ports:
      - "16160:16160"
    volumes:
      - "/dev:/dev"
      - "/var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket"
      - "/sys/fs/cgroup:/sys/fs/cgroup"
      - "/sbin/shutdown:/sbin/shutdown"
      - "/bin/systemctl:/bin/systemctl"
    restart: on-failure
    stop_grace_period: 1m
    command: ["-m", "virtio-serial", "-p", "/dev/virtio-ports/org.qemu.guest_agent.0"]
