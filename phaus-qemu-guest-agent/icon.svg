<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- chip pins (QEMU host side) -->
  <g stroke="#fbbf24" stroke-width="14" stroke-linecap="round">
    <line x1="120" y1="196" x2="72" y2="196"/>
    <line x1="120" y1="256" x2="72" y2="256"/>
    <line x1="120" y1="316" x2="72" y2="316"/>
    <line x1="392" y1="196" x2="440" y2="196"/>
    <line x1="392" y1="256" x2="440" y2="256"/>
    <line x1="392" y1="316" x2="440" y2="316"/>
  </g>

  <!-- chip body -->
  <rect x="112" y="148" width="288" height="216" rx="32" fill="url(#chip)"/>

  <!-- inner die -->
  <rect x="152" y="188" width="208" height="136" rx="16" fill="#0f172a"/>

  <!-- agent pulse: heartbeat line across the die -->
  <path d="M176 256 h36 l14 -28 20 56 18 -42 12 14 h56"
        fill="none" stroke="#34d399" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
